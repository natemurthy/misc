[pytest]
# Running `pytest` from this directory covers both suites, rl/tests and oc/tests.
# Each subdirectory also has its own pytest.ini so `pytest` works from inside it.
testpaths = rl/tests oc/tests
markers =
    slow: any test that takes longer than 0.1 s: training runs and subprocess CLI checks (run with -m slow)
    fast: everything under 0.1 s; applied automatically to any test not marked slow (run with -m fast)
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
