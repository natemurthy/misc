[pytest]
# Running `pytest` from this directory covers both suites, rl/tests and oc/tests.
# Each subdirectory also has its own pytest.ini so `pytest` works from inside it.
testpaths = rl/tests oc/tests
markers =
    slow: end-to-end learning tests that train an agent from scratch (run with -m slow)
    fast: everything else; applied automatically to any test not marked slow (run with -m fast)
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
